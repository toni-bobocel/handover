# docker compose up                   the core and the broker, for your own fleet.toml
# docker compose --profile demo up    the same, plus three simulated robots
#
# Point HANDOVER_FLEET at your site's file; it defaults to the demo warehouse.

services:
  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - HANDOVER_MQTT_PASSWORD
    volumes:
      - ${HANDOVER_FLEET:-./deploy/demo/fleet.toml}:/etc/handover/fleet.toml:ro
      - handover-data:/data
      - recordings:/recordings:ro
    depends_on:
      - mosquitto
      - mediamtx
    restart: unless-stopped
    mem_limit: 300m

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
      - "8883:8883"
    environment:
      - HANDOVER_MQTT_PASSWORD
    volumes:
      # deploy/site/ holds the locked-down broker config for a real site
      - ${HANDOVER_MQTT:-./deploy}:/mosquitto/config:ro
    restart: unless-stopped
    mem_limit: 32m

  mediamtx:
    # the -ffmpeg image, for the demo's simulated cameras; plain mediamtx is enough on a site
    image: bluenviron/mediamtx:1.21.4-ffmpeg
    ports:
      - "8189:8189/udp"
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings
    restart: unless-stopped
    mem_limit: 256m

  simulator:
    profiles: [demo]
    build: simulator
    volumes:
      - ./deploy/demo/fleet.toml:/etc/handover/fleet.toml:ro
    depends_on:
      - core
    restart: unless-stopped
    mem_limit: 128m

volumes:
  handover-data:
  # the camera ring buffer: in RAM, so 75 s of video per camera never touches the SSD
  recordings:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512m
