# For a real site: no anonymous clients, TLS on 8883.
#   mosquitto_passwd -c deploy/site/passwd handover
#   mosquitto_passwd deploy/site/passwd amr-01        (one account per robot)
# and put the site's certificate and key in deploy/site/tls/.
listener 8883
cafile /mosquitto/config/tls/ca.pem
certfile /mosquitto/config/tls/cert.pem
keyfile /mosquitto/config/tls/key.pem
allow_anonymous false
password_file /mosquitto/config/passwd
persistence false
log_dest stdout
log_type warning
